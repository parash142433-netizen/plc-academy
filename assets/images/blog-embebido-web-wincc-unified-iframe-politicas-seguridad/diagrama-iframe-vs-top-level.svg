<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Navegacion directa vs embebido en iframe</title>
  <desc id="desc">Comparacion visual entre cargar una URL como documento principal y cargarla dentro de un iframe en WinCC Unified Web Control.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#e9f2ff"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <style>
      .h{font:700 34px Segoe UI,Arial,sans-serif;fill:#0f2740}
      .sub{font:600 24px Segoe UI,Arial,sans-serif;fill:#1c4b73}
      .txt{font:500 20px Segoe UI,Arial,sans-serif;fill:#243b53}
      .small{font:500 18px Segoe UI,Arial,sans-serif;fill:#4b5d70}
      .ok{fill:#0e9f6e}
      .warn{fill:#c0392b}
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="820" fill="url(#bg)"/>
  <text x="700" y="60" text-anchor="middle" class="h">Misma URL, dos evaluaciones del navegador</text>

  <rect x="60" y="110" width="610" height="640" rx="20" fill="url(#box)" stroke="#c7dbf3" stroke-width="3"/>
  <text x="365" y="160" text-anchor="middle" class="sub">1) Navegacion directa (Top-Level)</text>
  <rect x="110" y="205" width="510" height="480" rx="14" fill="#ffffff" stroke="#8eb7e4" stroke-width="3"/>
  <rect x="110" y="205" width="510" height="48" rx="14" fill="#d9e9fb"/>
  <text x="128" y="236" class="small">https://objetivo/login</text>
  <text x="145" y="300" class="txt">• Documento principal</text>
  <text x="145" y="342" class="txt">• Sin ancestros de frame</text>
  <text x="145" y="384" class="txt">• Renderiza si responde 200</text>
  <text x="145" y="426" class="txt">• No se evalua policy de contencion</text>
  <text x="145" y="492" class="txt ok">Resultado: puede abrir en pestana</text>

  <rect x="730" y="110" width="610" height="640" rx="20" fill="url(#box)" stroke="#c7dbf3" stroke-width="3"/>
  <text x="1035" y="160" text-anchor="middle" class="sub">2) Embebido en Web Control (iframe)</text>
  <rect x="780" y="205" width="510" height="480" rx="14" fill="#ffffff" stroke="#8eb7e4" stroke-width="3"/>
  <rect x="780" y="205" width="510" height="48" rx="14" fill="#d9e9fb"/>
  <text x="798" y="236" class="small">Contenedor Unified + iframe destino</text>
  <text x="815" y="300" class="txt">• Subdocumento embebido</text>
  <text x="815" y="342" class="txt">• Evalua X-Frame-Options / CSP</text>
  <text x="815" y="384" class="txt">• Evalua origen exacto (SOP)</text>
  <text x="815" y="426" class="txt">• Evalua certificado para esa URL</text>
  <text x="815" y="492" class="txt warn">Resultado: puede bloquear aunque abra sola</text>

  <path d="M680 430 L720 430" stroke="#2d6aa3" stroke-width="5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2d6aa3"/>
    </marker>
  </defs>

  <text x="700" y="790" text-anchor="middle" class="small">Idea clave: abrir en navegador confirma disponibilidad; embebido exige cumplimiento de politicas de seguridad.</text>
</svg>
