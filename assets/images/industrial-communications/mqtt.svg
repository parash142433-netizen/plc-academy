<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80">
  <!-- MQTT official mark: pub/sub funnel symbol, official color #660066 -->
  <!-- Top circle (publisher/subscriber node) -->
  <circle cx="32" cy="12" r="8" fill="#660066"/>
  <!-- Funnel/broadcast arcs going down -->
  <path d="M 32,20 L 14,52 L 50,52 Z" fill="#660066" opacity="0.85"/>
  <path d="M 32,20 L 20,52 L 44,52 Z" fill="#ffffff" opacity="0.35"/>
  <!-- Bottom bar -->
  <rect x="12" y="52" width="40" height="7" rx="2" fill="#660066"/>
  <!-- MQTT text -->
  <text x="62" y="38" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="#660066" letter-spacing="1">MQTT</text>
  <text x="62" y="56" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#660066" opacity="0.75" letter-spacing="0.3">Standard for IoT Messaging</text>
</svg>
