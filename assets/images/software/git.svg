<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Git official logo — orange-red #F05032 -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F05032"/>
      <stop offset="100%" stop-color="#DE4C36"/>
    </linearGradient>
  </defs>
  <!-- Diamond background -->
  <rect x="14.6" y="14.6" width="70.7" height="70.7" rx="8" transform="rotate(45 50 50)" fill="url(#g1)"/>
  <!-- Git branch symbol (simplified white) -->
  <!-- Main vertical line -->
  <line x1="50" y1="28" x2="50" y2="72" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <!-- Branch line -->
  <line x1="50" y1="45" x2="65" y2="35" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <!-- Commit dots -->
  <circle cx="50" cy="28" r="5" fill="#fff"/>
  <circle cx="50" cy="72" r="5" fill="#fff"/>
  <circle cx="65" cy="35" r="5" fill="#fff"/>
</svg>
