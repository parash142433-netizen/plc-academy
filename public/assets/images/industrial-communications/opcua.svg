<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80">
  <!-- OPC Foundation official colors: dark blue #004A97, accent #6CACE4 -->
  <!-- Hexagon symbol (OPC UA uses a hexagonal motif) -->
  <polygon points="24,10 40,10 48,24 40,38 24,38 16,24" fill="#004A97"/>
  <polygon points="26,14 38,14 44,24 38,34 26,34 20,24" fill="none" stroke="#6CACE4" stroke-width="2"/>
  <line x1="32" y1="10" x2="32" y2="38" stroke="#6CACE4" stroke-width="1.5" opacity="0.6"/>
  <!-- OPC text -->
  <text x="58" y="28" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#004A97" letter-spacing="1">OPC</text>
  <!-- UA badge -->
  <rect x="58" y="35" width="36" height="16" rx="3" fill="#004A97"/>
  <text x="76" y="47" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">UA</text>
  <!-- Foundation small text -->
  <text x="100" y="47" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#6CACE4" letter-spacing="0.5">Foundation</text>
</svg>
