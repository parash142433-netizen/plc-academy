<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80">
  <!-- REST API — no single org; modern HTTP tech representation -->
  <!-- HTTP method pills -->
  <rect x="4" y="8" width="40" height="15" rx="4" fill="#22c55e"/>
  <text x="24" y="20" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">GET</text>
  <rect x="4" y="27" width="40" height="15" rx="4" fill="#3b82f6"/>
  <text x="24" y="39" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">POST</text>
  <rect x="4" y="46" width="40" height="15" rx="4" fill="#f97316"/>
  <text x="24" y="58" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">PUT</text>
  <!-- REST API text -->
  <text x="54" y="34" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="900" fill="#1e40af" letter-spacing="1">REST</text>
  <text x="54" y="56" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#1e40af" opacity="0.8">/api/v1</text>
</svg>
