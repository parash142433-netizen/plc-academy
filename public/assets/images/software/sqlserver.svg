<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80">
  <!-- Microsoft SQL Server — official red #CC2131 -->
  <defs>
    <linearGradient id="sq1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8293A"/>
      <stop offset="100%" stop-color="#CC2131"/>
    </linearGradient>
  </defs>
  <!-- Database cylinder icon -->
  <ellipse cx="30" cy="18" rx="18" ry="8" fill="url(#sq1)"/>
  <rect x="12" y="18" width="36" height="44" fill="url(#sq1)"/>
  <ellipse cx="30" cy="62" rx="18" ry="8" fill="#A81B28"/>
  <ellipse cx="30" cy="18" rx="18" ry="8" fill="#E8293A"/>
  <!-- Stripes on cylinder -->
  <ellipse cx="30" cy="32" rx="18" ry="5" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="30" cy="48" rx="18" ry="5" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
  <!-- SQL text -->
  <text x="58" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#CC2131" letter-spacing="0.5">SQL</text>
  <text x="58" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#444" letter-spacing="0.3">Server</text>
</svg>
